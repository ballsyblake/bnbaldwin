<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14161a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Boltyard</title>
  <meta name="description" content="Build battle bots from parts, then send your team into arena fights.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="top">
    <div class="logo">BOLT<span>YARD</span></div>
    <div class="cr" id="credits">0</div>
  </header>
  <nav class="tabs">
    <button data-act="tab" data-tab="garage" class="on">Garage</button>
    <button data-act="tab" data-tab="arenas">Arenas</button>
  </nav>
  <main id="view"></main>
  <div id="sheet" class="sheet hidden"></div>
  <section id="battle" class="battle hidden">
    <canvas id="arena"></canvas>
    <div class="hud">
      <div class="hp a"><i id="hpA"></i></div>
      <span id="clock">75</span>
      <div class="hp b"><i id="hpB"></i></div>
      <button data-act="speed" id="speedBtn">1x</button>
      <button data-act="pause" id="pauseBtn" aria-label="Pause">II</button>
      <button data-act="quit" aria-label="Leave battle">&times;</button>
    </div>
    <div class="hint" id="hint">Tap a foe to focus fire</div>
    <div class="result hidden" id="result"></div>
  </section>
  <div id="toast" class="toast"></div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
