<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="Content-Security-Policy" content="style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; media-src *;img-src 'self' data: content:;">
        <meta name="format-detection" content="telephone=no">
        <meta name="msapplication-tap-highlight" content="no">
        <meta name="viewport" content="initial-scale=1, width=device-width, viewport-fit=cover">
        <meta name="color-scheme" content="light dark">
        <title>NCF Appointments</title>
        <script type="text/javascript" src="js/jquery.js"></script>
        <script type="text/javascript" src="js/mock-api.js"></script>
        <script type="text/javascript" src="js/index.js"></script>
        <link rel="stylesheet" type="text/css" href="css/index.css">
    </head>
    <body>
        <div class="loginForm show" id="loginPanel">
            <img class="logo" src="img/ncf_logo.png" alt="Logo">
            <form method="post" action="#">
                <fieldset>
                    <legend>Login</legend>
                    <span id="user-availability-status"></span>
                    <input type="email" name="username" placeholder="Enter email..." id="username" required />
                    <div id="passwordArea">
                        <span hidden class='status-not-available' style='color: red;padding:5px;' id="incorPass"> Incorrect Password.</span>
                        <input type="password" id="password" name="password" placeholder="Enter password..." required />
                        <span toggle="#password" class="eye field-icon toggle-password"></span>
                    </div>
                    <input type="submit" value="Submit" id="submit"/>
                </fieldset>
            </form>
        </div>
    </body>
</html>
