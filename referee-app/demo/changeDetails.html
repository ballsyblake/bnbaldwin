<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN"
"http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
    <head lang="en" xml:lang="en">
        <meta http-equiv="content-type" content="text/html; charset=utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=0.86, maximum-scale=3.0, minimum-scale=0.86"/>
        <title>NCF Appointments</title>
        <link rel="stylesheet" type="text/css" href="css/index.css">
        <link rel="stylesheet" href="css/main.css">
        <script type="text/javascript" src="js/jquery.js"></script>
        <script type="text/javascript" src="js/mock-api.js"></script>
        <script type="text/javascript" src="js/index.js"></script>
        <style type="text/css">
            .appointmentTable {
                width: 100% !important;
            }
        </style>
    </head>
    <body>
        <div id="menuToggle">
            <input type="checkbox" />
            <span></span>
            <span></span>
            <span></span>
            <ul id="menu">
                <li><a href="homePage.html">Home</a></li>
                <li><a href="availability.html">Availability</a></li>
                <li id="menuOption"></li>
                <li><a href='profile.html'>Profile</a></li>           
                <li><a href="index.html">Logout</a></li>
            </ul>
        </div>
        <ul id="untoggleMenu">
            <li><img src="img/ncf_logo_correct.png" alt="logo"></li>
            <li><a class="hide" href="index.html">Logout</a></li>
            <li><a class='hide' href='profile.html'>Profile</a></li>
            <li id="menuOptionHide"></li>
            <li><a class="hide" href="availability.html">Availability</a></li>
            <li><a class="hide" href="homePage.html">Home</a></li>
        </ul>
        <div class="main" id="mainDiv">
            <h1 id="output">Edit Your Profile</h1>
            <hr>
            <fieldset class="passSet form__group field">
                <br>
                <label for='image' class="form__label">New Profile Picture:</label>
                <input type='file' class="form__field" name='image' id='image'>
                <br>
                <label for='firstName' class="form__label">New First Name:</label>
                <input type='text' class="form__field" name='firstName' id='firstName'>
                <br>
                <label for='lastName' class="form__label">New Last Name:</label>
                <input type='text' class="form__field" name='lastName' id='lastName'>
                <br>
                <label for='dob' class="form__label">New Date of Birth:</label>
                <input type='date' class="form__field" name='dob' id='dob'>
                <br>
                <label for='bsb' class="form__label">New BSB:</label>
                <input type='string' class="form__field" name='bsb' id='bsb' maxlength="6">
                <br>
                <label for='accNum' class="form__label">New Account Number:</label>
                <input type='string' class="form__field" name='accNum' id='accNum' maxlength="9" >
                <br>
            </fieldset>
            <a class='profileBtn1' href='profile.html'>Back</a>
            <input type='submit' class='profileBtn2' id="submit">
            <hr>
            <h1>Change Password</h1>
            <fieldset class="passSet form__group field" id="passwordSet">
                <label for='currentPassword' class="form__label">Current Password:</label>
                <input type='password' class="form__field" id='currentPassword' autocomplete="current-password">
                <br>
                <label for='newPassword' class="form__label">New Password (8+ characters):</label>
                <input type='password' class="form__field" id='newPassword' autocomplete="new-password">
                <br>
                <label for='newPassword2' class="form__label">New Password again:</label>
                <input type='password' class="form__field" id='newPassword2' autocomplete="new-password">
                <br>
            </fieldset>
            <input type='submit' class='profileBtn2' id="passwordSubmit" value="Change password">
            <hr>
        </div>
    </body>
</html>
