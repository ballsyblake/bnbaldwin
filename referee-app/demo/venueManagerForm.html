<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN"
"http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
    <head lang="en" xml:lang="en">
        <meta http-equiv="content-type" content="text/html; charset=utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=0.86, maximum-scale=3.0, minimum-scale=0.86"/>
        <title>NCF Appointments</title>
        <link rel="stylesheet" type="text/css" href="css/index.css">
        <link rel="stylesheet" href="css/main.css">
        <script type="text/javascript" src="js/jquery.js"></script>
        <script type="text/javascript" src="js/mock-api.js"></script>
        <script type="text/javascript" src="js/index.js"></script>
    </head>
    <body>
        
        <div class="main" id="venueManagerFormMain">
            <div class="nominationForm formLimit">
                <h1>Venue Manager Application</h1>
                <form>
                    <fieldset>
                        <legend>Staff Information</legend>
                        <input type="text" required id="firstName" name="firstName" placeholder="First Name...">
                        <input type="text" required id="lastName" name="lastName" placeholder="Last Name...">
                        <input type="email" required id="email" name="email" placeholder="Email...">
                        <input type="text" onfocus="(this.type='date')" onblur="(this.type='text')" id="dob" name="dob" placeholder="Date of Birth...">
                        <input type="text" id="street" name="street" placeholder="Street Address...">
                        <input type="text" id="suburb" name="suburb" placeholder="Suburb...">
                        <input type="number" id="postcode" name="postcode" placeholder="Postcode...">
                        <input type="tel" id="mobile" name="mobile" placeholder="Mobile..." pattern="[0-9]{10}">
                        <input type="text" id="wwvpNo" name="wwvpNo" placeholder="WWVP Number...">
                        <input type="text" onfocus="(this.type='date')" onblur="(this.type='text')" id="wwvpEx" name="wwvpEx" placeholder="WWVP Expiry...">
                        <label for="firstAid">First Aid Certificate</label>
                        <input required type='file' name='firstAid' id='firstAid' accept='.pdf,.doc,.docx,.png,.jpg,.jpeg'>
                    </fieldset>
                    <fieldset>
                        <legend>Emergency Contact Information</legend>
                        <input type="text" id="firstNameEC" name="firstNameEC" placeholder="First Name...">
                        <input type="text" id="lastNameEC" name="lastNameEC" placeholder="Last Name...">
                        <input type="email" id="emailEC" name="emailEC" placeholder="Email...">
                        <input type="tel" id="mobileEC" name="mobileEC" placeholder="Mobile..." pattern="[0-9]{10}">
                        <input type="tel" id="altMobileEC" name="altMobileEC" placeholder="Alt Mobile..." pattern="[0-9]{10}">
                    </fieldset>
                    <fieldset>
                        <legend>Bank Details</legend>
                        <input type="text" id="accName" name="accName" placeholder="Account Name...">
                        <input type="text" id="bsb" name="bsb" placeholder="BSB...">
                        <input type="text" id="accNum" name="accNum" placeholder="Account Number..." >
                    </fieldset>
                    <input class="submitBtn" type="submit" value="Submit">
                </form>
            </div>
        </div>
    </body>
</html>
