        <style type="text/css">
            .main {
                padding-left: 5%;
                max-width: 1000px;
                margin-left: auto;
                margin-right: auto;
            }
            
            table {
                border-collapse: collapse;
            }

            table td {
                width:10%;
                height: 100%;
                text-align:center;
                vertical-align:middle;
                background-color: #d9514eff;
                border:3px solid #ebebea;
                
                
                border-top: none;
                border-bottom: none;
                color: #f5f5f5;
                
            }
        
            table th {
                width:10%;
                height: 100%;
                text-align:center;
                vertical-align:middle;
                background-color: #2B2E30;
                border:3px solid #ebebea;
                
                
                border-top-width: 20px;
                color: #889199;
            } 

            table tbody {
                border-bottom-width: 10px !important;
            }       

            td:empty {
                visibility: hidden;
            }

            table td.highlighted {
            background-color:#2da8d8ff;
            color: #f5f5f5;
            }

            .testingTable {
                margin-right: 5%;
                width: 95%;
                
            }

            .testingTable thead th{
                height: 50px !important;
                font-size: 20px;
            }
            .testingTable tbody td{
                height: 50px !important;
                font-size: calc(14px + (24 - 14) * ((100vw - 300px) / (1600 - 300)));
                cursor: pointer;
                
            }

            textarea {
                resize: none;
                
                background-color: #2B2E30;
                border: 0;
                font-family: inherit;
                width: auto;
                min-width: 75%;
                outline: 0;
                font-size: 1.3rem;
                color: #fff;
                padding: 8px 6px 8px 6px;
                margin: 10%;
                margin-top: 20px;
                margin-bottom: 5px;
                
                transition: border-color 0.2s;
                
            }
