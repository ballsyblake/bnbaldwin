<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Gunther</title>
  <meta name="description" content="Gunther: raise a warband, trade across the island, and break the orc Horde. A small browser sandbox game by Blake Baldwin.">
  <meta property="og:title" content="Gunther">
  <meta property="og:description" content="Raise a warband, trade across the island, and break the orc Horde.">
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Pixelify+Sans:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    /* Style tokens from the UI style guide. Every colour in the interface comes from this list. */
    :root {
      --panel: #1d1a16; --tile: #2a241d; --tile-sel: #3a3127; --bevel: #4a3f31; --outline: #0d0b09;
      --text: #f4ead2; --muted: #c9bb9c; --gold: #f2c14e; --good: #3ddc84; --blue: #3b7dd8; --danger: #e0533d;
      --pixel: "Pixelify Sans", "Inter", system-ui, sans-serif;
      --sans: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: #0d0b09; color: var(--text); font: 16px/1.45 var(--sans); }
    body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 8px; }
    /* --u is one canvas pixel, so HUD boxes line up with what the canvas draws at any screen size. */
    #stage { position: relative; width: min(100%, calc((100vh - 56px) * 16 / 9)); aspect-ratio: 16 / 9; background: #000; overflow: hidden; container-type: inline-size; --u: calc(100cqw / 960);
      --fs-label: calc(var(--u) * 9); --fs-body: calc(var(--u) * 11); --fs-value: calc(var(--u) * 15); --fs-title: calc(var(--u) * 17); }
    #stage { width: min(100%, calc((100dvh - 56px) * 16 / 9)); }
    #stage.portrait { aspect-ratio: 3 / 5; width: min(100%, calc((100vh - 56px) * 3 / 5)); --u: calc(100cqw / 540);
      --fs-label: calc(var(--u) * 13); --fs-body: calc(var(--u) * 16); --fs-value: calc(var(--u) * 20); --fs-title: calc(var(--u) * 24); }
    #stage.portrait { width: min(100%, calc((100dvh - 56px) * 3 / 5)); }
    canvas { width: 100%; height: 100%; display: block; image-rendering: pixelated; touch-action: none; cursor: crosshair; }

    /* ---- shared building blocks: panel, tile, button, bar ---- */
    .box { background: var(--panel); border: calc(var(--u) * 3) solid var(--outline); box-shadow: inset 0 0 0 calc(var(--u) * 2) var(--bevel); }
    .px { font-family: var(--pixel); font-weight: 700; }
    .lbl { font-size: var(--fs-label); text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 500; }
    /* Pixelify Sans draws 2 and 5 almost like 8 and S, so numbers use Inter. */
    .num, .tile b, .btop b[data-k], .odds b, .rhead .chip b, .detail .sg b { font-family: var(--sans) !important; font-weight: 700; font-variant-numeric: tabular-nums; }
    .gold { color: var(--gold); } .goodc { color: var(--good); } .dangerc { color: var(--danger); } .bluec { color: #7fb0ff; } .mutedc { color: var(--muted); }

    /* ---- in-game HUD layer: sits over the canvas, lets clicks through except on its boxes ---- */
    #ui { position: absolute; inset: 0; pointer-events: none; font-size: var(--fs-body); }
    #ui .box, #ui button { pointer-events: auto; }
    #overlay.show ~ #ui { display: none; }
    #ui button { font: 700 var(--fs-body) var(--pixel); color: var(--text); background: var(--tile); border: calc(var(--u) * 2) solid var(--outline); cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.15; }
    #ui button small { font: 500 var(--fs-label) var(--sans); color: var(--muted); }
    #ui button:hover { background: var(--tile-sel); }
    #ui button.primary { background: var(--gold); color: var(--outline); }
    #ui button.primary small { color: #5a4413; }
    #ui button.sel { background: var(--tile-sel); outline: calc(var(--u) * 2) solid var(--gold); outline-offset: calc(var(--u) * -2); }
    #ui .abs { position: absolute; }
    .meter { height: calc(var(--u) * 5); background: var(--outline); position: relative; }
    .meter > i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--good); }
    .meterhead { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: calc(var(--u) * 2); }
    .meterhead span:last-child { font-size: var(--fs-label); color: var(--muted); }

    /* map: stats panel */
    .mstats { left: calc(var(--u) * 10); top: calc(var(--u) * 10); width: calc(var(--u) * 420); padding: calc(var(--u) * 10) calc(var(--u) * 12); }
    .mstats .top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: calc(var(--u) * 6); }
    .mstats .top b { font-size: var(--fs-title); color: var(--gold); }
    .mstats .top span { color: var(--muted); }
    .tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: calc(var(--u) * 5); margin-bottom: calc(var(--u) * 7); }
    .tile { background: var(--tile); padding: calc(var(--u) * 4) calc(var(--u) * 6); }
    .tile b { display: block; font-size: var(--fs-value); white-space: nowrap; }
    .tile b small { font-size: var(--fs-label); color: var(--muted); font-family: var(--sans); font-weight: 500; }
    .bars2 { display: grid; grid-template-columns: 1fr 1fr; gap: calc(var(--u) * 10); }
    .portrait .mstats { width: calc(var(--u) * 360); left: calc(var(--u) * 8); top: calc(var(--u) * 8); padding: calc(var(--u) * 8); }
    .portrait .tiles { grid-template-columns: repeat(2, 1fr); }
    /* map: minimap legend, place card, speed and action bars */
    .legend { padding: calc(var(--u) * 5) calc(var(--u) * 8); display: flex; flex-wrap: wrap; gap: calc(var(--u) * 3) calc(var(--u) * 10); }
    .legend span { display: inline-flex; align-items: center; gap: calc(var(--u) * 4); white-space: nowrap; }
    .sw { display: inline-block; width: calc(var(--u) * 8); height: calc(var(--u) * 8); }
    .place { width: calc(var(--u) * 180); padding: calc(var(--u) * 9) calc(var(--u) * 11); }
    .portrait .place { width: calc(var(--u) * 300); }
    .place .kind { font-size: var(--fs-label); letter-spacing: 0.08em; text-transform: uppercase; }
    .place h3 { font: 700 var(--fs-title) var(--pixel); margin: calc(var(--u) * 2) 0 calc(var(--u) * 5); }
    .place .row { display: flex; justify-content: space-between; color: var(--muted); }
    .place .row b { color: var(--text); font-weight: 600; }
    .place button { width: 100%; margin-top: calc(var(--u) * 7); min-height: calc(var(--u) * 24); }
    .speed, .actions { display: flex; gap: calc(var(--u) * 4); padding: calc(var(--u) * 5); }
    .speed { left: calc(var(--u) * 10); bottom: calc(var(--u) * 10); }
    .speed button { width: calc(var(--u) * 34); height: calc(var(--u) * 28); }
    .actions { right: calc(var(--u) * 10); bottom: calc(var(--u) * 10); }
    .actions button { min-width: calc(var(--u) * 64); height: calc(var(--u) * 36); padding: 0 calc(var(--u) * 6); }
    .portrait .speed button { width: calc(var(--u) * 46); height: calc(var(--u) * 40); }
    .portrait .speed { bottom: calc(var(--u) * 78); left: calc(var(--u) * 8); }
    .portrait .actions { left: calc(var(--u) * 8); right: calc(var(--u) * 8); bottom: calc(var(--u) * 8); }
    .portrait .actions button { flex: 1; min-width: 0; height: calc(var(--u) * 56); }

    /* battle: top bar, group cards, orders */
    .btop { left: calc(var(--u) * 10); right: calc(var(--u) * 10); top: calc(var(--u) * 8); padding: calc(var(--u) * 7) calc(var(--u) * 12); display: grid; grid-template-columns: 1fr auto 1fr; gap: calc(var(--u) * 18); align-items: center; }
    .btop .side .meter { margin: calc(var(--u) * 3) 0 calc(var(--u) * 5); }
    .btop .name { font-size: var(--fs-title); }
    .btop .right .meterhead { flex-direction: row-reverse; }
    .btop .odds { text-align: center; }
    .btop .odds b { display: block; font-size: calc(var(--fs-title) * 1.3); line-height: 1.1; }
    .groups, .orders { bottom: calc(var(--u) * 8); padding: calc(var(--u) * 5); display: flex; gap: calc(var(--u) * 4); }
    .groups { left: calc(var(--u) * 10); }
    .groups button { width: calc(var(--u) * 78); height: calc(var(--u) * 46); align-items: flex-start !important; padding: 0 calc(var(--u) * 7); text-align: left; }
    .groups button small:last-child { color: var(--gold); }
    .groups .gh { display: flex; justify-content: space-between; width: 100%; font: 500 var(--fs-label) var(--sans); color: var(--muted); }
    .orders { right: calc(var(--u) * 10); flex-direction: column; }
    .orders .lbl b { color: var(--text); }
    .orders div { display: flex; gap: calc(var(--u) * 4); }
    .orders button { width: calc(var(--u) * 66); height: calc(var(--u) * 34); }
    .portrait .btop { left: calc(var(--u) * 6); right: calc(var(--u) * 6); top: calc(var(--u) * 6); gap: calc(var(--u) * 8); padding: calc(var(--u) * 6) calc(var(--u) * 8); }
    .portrait .btop .name { font-size: calc(var(--u) * 18); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: calc(var(--u) * 150); display: inline-block; }
    .portrait .groups { left: calc(var(--u) * 6); right: calc(var(--u) * 6); bottom: calc(var(--u) * 82); }
    .portrait .groups button { flex: 1; width: auto; height: calc(var(--u) * 50); }
    .portrait .orders { left: calc(var(--u) * 6); right: calc(var(--u) * 6); bottom: calc(var(--u) * 6); }
    .portrait .orders div button { flex: 1; width: auto; height: calc(var(--u) * 44); }
    .portrait .orders .lbl { display: none; }
    /* Shrinkable panels: a small button in the corner toggles a compact form. */
    #ui .mm { position: absolute; top: 0; right: 0; width: calc(var(--u) * 16); height: calc(var(--u) * 16); min-width: 0; padding: 0; font: 700 calc(var(--u) * 14) var(--sans); line-height: 1; z-index: 2; color: var(--muted); }
    .portrait #ui .mm { width: calc(var(--u) * 26); height: calc(var(--u) * 26); font-size: calc(var(--u) * 20); }
    [data-min] > .mini { display: none; }
    #ui [data-min].min > :not(.mini):not(.mm) { display: none; }
    #ui [data-min].min > .mini { display: block; white-space: nowrap; }
    .mstats.min, .btop.min { width: auto; right: auto; padding: calc(var(--u) * 5) calc(var(--u) * 26) calc(var(--u) * 5) calc(var(--u) * 9); }
    .portrait .mstats.min, .portrait .btop.min { padding-right: calc(var(--u) * 34); }
    .btop.min { display: block; }
    .mapmm { pointer-events: none; }
    .mapmm.min { width: auto !important; height: auto !important; left: auto !important; right: calc(var(--u) * 10); }
    .mapmm .mini { pointer-events: auto; padding: calc(var(--u) * 5) calc(var(--u) * 26) calc(var(--u) * 5) calc(var(--u) * 9); color: var(--muted); }
    .portrait .mapmm .mini { padding-right: calc(var(--u) * 34); }
    /* Compact action and order bars keep their buttons, just smaller. */
    #ui [data-min].box.actions.min > button, #ui [data-min].box.orders.min > div { display: flex; }
    #ui .actions.min, #ui .orders.min { padding-right: calc(var(--u) * 20); }
    .portrait #ui .actions.min, .portrait #ui .orders.min { padding-right: calc(var(--u) * 30); }
    .actions.min button { height: calc(var(--u) * 22) !important; min-width: calc(var(--u) * 44); }
    .actions.min button small, .orders.min button small { display: none; }
    .orders.min button { height: calc(var(--u) * 24) !important; }
    .portrait .actions.min { left: auto; }
    .portrait .actions.min button { height: calc(var(--u) * 34) !important; min-width: calc(var(--u) * 70); flex: none; }
    .portrait .orders.min div button { height: calc(var(--u) * 32) !important; }
    .groups:not(.min) { padding-right: calc(var(--u) * 19); }
    .portrait .groups:not(.min) { padding-right: calc(var(--u) * 29); }
    .groups.min { padding: calc(var(--u) * 5) calc(var(--u) * 26) calc(var(--u) * 5) calc(var(--u) * 9); right: auto !important; }
    .portrait .groups.min { padding-right: calc(var(--u) * 34); }
    .herobox { left: 50%; transform: translateX(-50%); bottom: calc(var(--u) * 8); padding: calc(var(--u) * 5); display: flex; gap: calc(var(--u) * 4); }
    .herobox button { width: calc(var(--u) * 74); height: calc(var(--u) * 46); }
    .portrait .herobox { left: auto; right: calc(var(--u) * 6); transform: none; bottom: calc(var(--u) * 146); }
    .portrait .herobox button { width: calc(var(--u) * 110); height: calc(var(--u) * 50); }
    .finish { left: 50%; transform: translateX(-50%); bottom: calc(var(--u) * 14); padding: calc(var(--u) * 5); }
    .finish button { padding: 0 calc(var(--u) * 16); height: calc(var(--u) * 36); }

    /* ---- menus (HTML panels over the canvas) ---- */
    #overlay { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(13, 11, 9, 0.62); padding: 12px; }
    #overlay.show { display: flex; }
    #overlay.left { justify-content: flex-start; padding-left: 6%; }
    .panel { background: var(--panel); border: 3px solid var(--outline); box-shadow: inset 0 0 0 2px var(--bevel), 0 6px 0 rgba(0,0,0,0.35); padding: clamp(12px, 3vw, 26px); width: min(100%, 470px); max-height: 100%; overflow: auto; text-align: left; }
    .panel h1 { font: 700 clamp(2.2rem, 8vw, 4.2rem)/1 var(--pixel); color: var(--text); margin: 6px 0 10px; }
    .panel h2 { font: 700 clamp(1.25rem, 4vw, 1.75rem)/1.2 var(--pixel); color: var(--gold); margin-bottom: 4px; }
    .panel h3 { font: 700 1rem var(--pixel); color: var(--gold); margin-top: 12px; }
    .panel .eyebrow { font-size: 0.78rem; letter-spacing: 0.22em; text-transform: uppercase; color: var(--gold); font-weight: 600; }
    .panel p { color: var(--muted); margin: 8px 0; font-size: clamp(0.8rem, 2.4vw, 0.98rem); }
    .panel .stats { color: var(--text); font-weight: 600; }
    .panel button { display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%; min-height: 44px; margin-top: 8px; padding: 8px 14px; font: 700 1rem var(--pixel); color: var(--text); background: var(--tile); border: 2px solid var(--outline); box-shadow: inset 0 0 0 1px var(--bevel); cursor: pointer; text-align: left; }
    .panel button:hover:not(:disabled) { background: var(--tile-sel); }
    .panel .filebtn { display: flex; align-items: center; width: 100%; min-height: 44px; margin-top: 8px; padding: 8px 14px; font: 700 1rem var(--pixel); color: var(--text); background: var(--tile); border: 2px dashed var(--bevel); cursor: pointer; box-sizing: border-box; }
    .panel .filebtn:hover { background: var(--tile-sel); }
    .panel a { color: var(--gold); }
    .panel button.primary { background: var(--gold); color: var(--outline); box-shadow: none; }
    .panel button.primary:hover:not(:disabled) { background: #f7cf6b; }
    .panel button:disabled { background: #221d18; color: #6d6252; cursor: default; box-shadow: none; }
    .panel button .hk { font: 500 0.8rem var(--sans); opacity: 0.75; }
    .panel button.secondary { background: var(--panel); }
    .panel .msg { color: var(--good); }
    .panel.wide { width: min(100%, 720px); }
    .panel.title { width: min(100%, 470px); }
    .panel .left, .panel ul { text-align: left; }
    .panel ul { padding-left: 18px; color: var(--muted); font-size: 0.9rem; }
    .panel .good { color: var(--good); }
    .panel .bad { color: var(--danger); }
    .panel .warn { color: var(--gold); }
    .panel .rumour { font-style: italic; }
    .panel .small { font-size: 0.75rem; color: #8f846d; }
    .panel table { width: 100%; border-collapse: collapse; margin: 6px 0; font-size: clamp(0.72rem, 2.2vw, 0.9rem); color: var(--text); }
    .panel th { text-align: left; color: var(--muted); font-weight: 500; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; padding: 3px 6px; }
    .panel td { text-align: left; padding: 4px 6px; border-top: 1px solid var(--tile-sel); }
    .panel td.ups { white-space: normal; }
    .panel button.mini { display: inline-flex; width: auto; min-height: 0; margin: 1px 2px; padding: 3px 8px; font-size: 0.8rem; white-space: nowrap; }
    .panel .tabs { display: flex; gap: 6px; margin: 10px 0; }
    .panel .tabs button { margin: 0; min-height: 36px; padding: 4px 12px; width: auto; flex: 1; justify-content: center; }
    .panel .tabs button.on { background: var(--tile-sel); border-color: var(--gold); }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
    .chips span { background: var(--panel); border: 2px solid var(--outline); padding: 4px 10px; font-size: 0.8rem; color: var(--muted); }
    .dot { display: inline-block; width: 10px; height: 10px; margin-right: 6px; }
    /* party roster */
    .rhead { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; margin-bottom: 4px; }
    .rhead h2 { margin: 0; }
    .rhead .chip { background: var(--tile); padding: 3px 9px; font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
    .rhead .chip b { font: 700 0.95rem var(--pixel); letter-spacing: 0; text-transform: none; margin-left: 4px; }
    .roster { display: grid; grid-template-columns: 1fr minmax(180px, 34%); gap: 10px; }
    .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 6px; align-content: start; }
    .panel button.card { display: block; margin: 0; padding: 6px 8px 8px; min-height: 0; background: var(--tile); text-align: center; font-family: var(--sans); }
    .panel button.card.sel { border-color: var(--gold); background: var(--tile-sel); }
    .card .ch { display: flex; justify-content: space-between; font: 500 0.66rem var(--sans); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
    .card img { display: block; width: 64px; height: 64px; margin: 2px auto; image-rendering: pixelated; }
    .card .cn { font: 700 0.92rem var(--pixel); color: var(--text); }
    .card .meter { margin-top: 6px; height: 5px; }
    .detail { background: var(--tile); padding: 10px 12px; }
    .detail .kind { font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--gold); font-weight: 600; }
    .detail h3 { font-size: 1.35rem; color: var(--text); margin: 2px 0 2px; }
    .detail .sg { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 4px; margin: 8px 0; }
    .detail .sg div { background: var(--panel); padding: 4px 8px; display: flex; justify-content: space-between; font-size: 0.82rem; color: var(--muted); }
    .detail .sg b { font: 700 0.9rem var(--pixel); color: var(--text); }
    .detail p { font-size: 0.82rem; margin: 6px 0; }
    .rfoot { margin-top: 10px; background: var(--tile); padding: 8px 12px; font-size: 0.85rem; color: var(--muted); }
    @media (max-width: 620px) { .roster { grid-template-columns: 1fr; } }
    @media (max-height: 460px) {
      body { padding: 2px; gap: 2px; }
      #stage { width: min(100%, calc((100vh - 28px) * 16 / 9)); }
      #stage { width: min(100%, calc((100dvh - 28px) * 16 / 9)); }
      .panel { padding: 8px 14px; width: min(100%, 560px); }
      .panel p { margin: 2px 0; font-size: 0.78rem; line-height: 1.3; }
      .panel h1 { font-size: 2rem; } .panel h2 { font-size: 1.2rem; }
      .panel button { padding: 4px 10px; margin-top: 5px; min-height: 34px; font-size: 0.9rem; }
    }
    footer { font-size: 0.8rem; color: #8f846d; }
    footer a { color: var(--muted); }
  </style>
</head>
<body>
  <div id="stage">
    <canvas id="game" width="960" height="540"></canvas>
    <div id="overlay"></div>
    <div id="ui"></div>
  </div>
  <footer><a href="../">Back to bnbaldwin.com</a></footer>
  <script type="module" src="js/main.js"></script>
</body>
</html>
