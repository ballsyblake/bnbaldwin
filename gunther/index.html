<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Gunther</title>
  <meta name="description" content="Gunther: raise a warband, trade across the island, and break the orc Horde. A small browser sandbox game by Blake Baldwin.">
  <meta property="og:title" content="Gunther">
  <meta property="og:description" content="Raise a warband, trade across the island, and break the orc Horde.">
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: #14161a; color: #eceef2; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
    body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 8px; }
    #stage { position: relative; width: min(100%, calc((100vh - 56px) * 16 / 9)); aspect-ratio: 16 / 9; background: #000; border-radius: 8px; overflow: hidden; }
    #stage { width: min(100%, calc((100dvh - 56px) * 16 / 9)); }
    #stage.portrait { aspect-ratio: 3 / 5; width: min(100%, calc((100vh - 56px) * 3 / 5)); }
    #stage.portrait { width: min(100%, calc((100dvh - 56px) * 3 / 5)); }
    canvas { width: 100%; height: 100%; display: block; image-rendering: pixelated; touch-action: none; cursor: crosshair; }
    #overlay { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(10, 12, 16, 0.72); padding: 12px; }
    #overlay.show { display: flex; }
    .panel { background: #1f232b; border: 2px solid #c9a24a; border-radius: 12px; padding: clamp(12px, 3vw, 28px); width: min(100%, 460px); max-height: 100%; overflow: auto; text-align: center; }
    .panel h1 { font-size: clamp(1.6rem, 6vw, 3rem); letter-spacing: 0.08em; color: #f0cf7a; }
    .panel h2 { font-size: clamp(1.2rem, 4vw, 1.7rem); color: #f0cf7a; }
    .panel p { color: #c5cad6; margin: 8px 0; font-size: clamp(0.8rem, 2.4vw, 1rem); }
    .panel .stats { color: #eceef2; font-weight: 600; }
    .panel button { display: block; width: 100%; margin-top: 8px; padding: 10px 12px; font: inherit; font-weight: 600; color: #14161a; background: #f0cf7a; border: 0; border-radius: 8px; cursor: pointer; }
    .panel button:hover:not(:disabled) { background: #ffe19a; }
    .panel button:disabled { background: #4a4f5c; color: #9097a6; cursor: default; }
    .panel button.secondary { background: #343a47; color: #eceef2; }
    .panel .msg { color: #9fd99a; }
    .panel.wide { width: min(100%, 680px); }
    .panel h3 { color: #f0cf7a; margin-top: 10px; font-size: 1rem; }
    .panel .left, .panel ul { text-align: left; }
    .panel ul { padding-left: 18px; color: #c5cad6; font-size: 0.9rem; }
    .panel .good { color: #9fd99a; }
    .panel .bad { color: #ff9a8a; }
    .panel .warn { color: #ffd27a; }
    .panel .rumour { font-style: italic; }
    .panel .small { font-size: 0.75rem; color: #8b91a0; }
    .panel table { width: 100%; border-collapse: collapse; margin: 6px 0; font-size: clamp(0.72rem, 2.2vw, 0.9rem); color: #dfe2ea; }
    .panel th { text-align: left; color: #8b91a0; font-weight: 600; padding: 2px 4px; }
    .panel td { text-align: left; padding: 3px 4px; border-top: 1px solid #2e3440; }
    .panel td.ups { white-space: normal; }
    .panel button.mini { display: inline-block; width: auto; margin: 1px 2px; padding: 3px 8px; font-size: 0.8rem; white-space: nowrap; }
    .panel button.secondary:disabled { background: #2a2e37; color: #5c6270; }
    .panel .tabs { display: flex; gap: 6px; margin: 8px 0; }
    .panel .tabs button { margin: 0; padding: 6px 8px; background: #343a47; color: #eceef2; }
    .panel .tabs button.on { background: #f0cf7a; color: #14161a; }
    .meter { display: inline-block; width: 60px; height: 6px; background: #343a47; border-radius: 3px; overflow: hidden; vertical-align: middle; }
    .meter span { display: block; height: 100%; background: #f0cf7a; }
    .dot { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; }
    #hud { position: absolute; right: 8px; bottom: 8px; display: flex; gap: 6px; }
    #hud button { font: inherit; font-size: 0.85rem; font-weight: 600; padding: 6px 12px; border-radius: 8px; border: 2px solid #c9a24a; background: rgba(31, 35, 43, 0.9); color: #f0cf7a; cursor: pointer; }
    #hud button.on { background: #f0cf7a; color: #14161a; }
    #overlay.show ~ #hud { display: none; }
    @media (max-height: 460px) {
      body { padding: 2px; gap: 2px; }
      #stage { width: min(100%, calc((100vh - 28px) * 16 / 9)); }
      #stage { width: min(100%, calc((100dvh - 28px) * 16 / 9)); }
      .panel { padding: 8px 14px; width: min(100%, 560px); }
      .panel p { margin: 2px 0; font-size: 0.78rem; line-height: 1.3; }
      .panel h1, .panel h2 { font-size: 1.2rem; }
      .panel button { padding: 5px 10px; margin-top: 5px; font-size: 0.85rem; }
    }
    footer { font-size: 0.8rem; color: #8b91a0; }
    footer a { color: #9db8ff; }
  </style>
</head>
<body>
  <div id="stage">
    <canvas id="game" width="960" height="540"></canvas>
    <div id="overlay"></div>
    <div id="hud"></div>
  </div>
  <footer><a href="../">Back to bnbaldwin.com</a></footer>
  <script type="module" src="js/main.js"></script>
</body>
</html>
