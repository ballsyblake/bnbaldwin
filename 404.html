<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found - Blake Baldwin</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    :root { --bg: #f6f5f2; --ink: #1b1d22; --muted: #5d6270; --accent: #2f6fe4; --accent-ink: #fff; color-scheme: light; }
    @media (prefers-color-scheme: dark) { :root { --bg: #121418; --ink: #eceef2; --muted: #a0a6b3; --accent: #6a9cff; --accent-ink: #0d1016; color-scheme: dark; } }
    * { box-sizing: border-box; margin: 0; }
    body { background: var(--bg); color: var(--ink); font: 16px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { max-width: 560px; margin: 0 auto; padding: 96px 16px; }
    h1 { font-size: 2rem; line-height: 1.2; }
    p { color: var(--muted); margin: 12px 0 24px; }
    a { display: inline-block; background: var(--accent); color: var(--accent-ink); text-decoration: none; font-weight: 600; padding: 8px 16px; border-radius: 8px; margin: 0 8px 8px 0; }
  </style>
</head>
<body>
  <main>
    <h1>Page not found</h1>
    <p>That page doesn't exist, or it has moved.</p>
    <a href="/">Go to the home page</a>
    <a href="/gunther/">Play Gunther</a>
  </main>
</body>
</html>
